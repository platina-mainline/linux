%YAML 1.2
---
$id: http://devicetree.org/schemas/power/qcom,sdm660-gfx-bhs.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm SDM660 GFX supply in BHS mode

maintainers:
  - Bjorn Andersson <andersson@kernel.org>

description: |
  On boards that disable GFX LDO operation and CPR closed-loop control,
  the GPU is supplied from CX through the bypass head switch (BHS).
  This controller manages CX performance states, the MX vote for GPU
  PLLs, and the GFX memory-access selector. It prepares these supplies
  before enabling the GX GDSC, and releases them after GX collapses.
  Both the GPU and its SMMU use this power domain. Performance states
  use the RPM_SMD_LEVEL_* values from qcom-rpmpd.h.

properties:
  compatible:
    const: qcom,sdm660-gfx-bhs

  reg:
    items:
      - description: GFX LDO and BHS registers
      - description: GFX memory-access selector

  reg-names:
    items:
      - const: bhs
      - const: mem-acc

  '#power-domain-cells':
    const: 0

  power-domains:
    items:
      - description: CX RPM power domain
      - description: MX RPM power domain
      - description: GPU GX GDSC

  power-domain-names:
    items:
      - const: cx
      - const: mx
      - const: gx

  operating-points-v2: true

  opp-table:
    type: object

required:
  - compatible
  - reg
  - reg-names
  - '#power-domain-cells'
  - power-domains
  - power-domain-names
  - operating-points-v2

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,gpucc-sdm660.h>
    #include <dt-bindings/power/qcom-rpmpd.h>

    power-controller@506e000 {
        compatible = "qcom,sdm660-gfx-bhs";
        reg = <0x0506e000 0x34>, <0x01fcf004 0x4>;
        reg-names = "bhs", "mem-acc";
        #power-domain-cells = <0>;
        power-domains = <&rpmpd RPMPD_VDDCX>,
                        <&rpmpd RPMPD_VDDMX>,
                        <&gpucc GPU_GX_GDSC>;
        power-domain-names = "cx", "mx", "gx";
        operating-points-v2 = <&gfx_opp_table>;

        gfx_opp_table: opp-table {
            compatible = "operating-points-v2";
            opp-48 { opp-level = <RPM_SMD_LEVEL_MIN_SVS>; };
            opp-64 { opp-level = <RPM_SMD_LEVEL_LOW_SVS>; };
            opp-128 { opp-level = <RPM_SMD_LEVEL_SVS>; };
            opp-192 { opp-level = <RPM_SMD_LEVEL_SVS_PLUS>; };
            opp-256 { opp-level = <RPM_SMD_LEVEL_NOM>; };
            opp-320 { opp-level = <RPM_SMD_LEVEL_NOM_PLUS>; };
            opp-384 { opp-level = <RPM_SMD_LEVEL_TURBO>; };
        };
    };
