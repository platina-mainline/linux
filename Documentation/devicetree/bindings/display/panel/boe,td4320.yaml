%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/boe,td4320.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: BOE TD4320 MIPI-DSI panels

maintainers:
  - Barnabas Czeman <barnabas.czeman@mainlining.org>

description:
  BOE TD4320 panels found in Xiaomi Redmi Note 7 and Xiaomi Mi 8 Lite
  smartphones. Without reset-gpios, the panel must already be initialized
  and powered by the bootloader. The driver then preserves the panel's
  power, reset, backlight and command state while the display controller
  starts its own scanout.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    items:
      - const: boe,td4320

  reg:
    maxItems: 1

  reset-gpios:
    maxItems: 1
    description:
      Active-low panel reset. Providing this property enables driver-managed
      power, reset and full command initialization. Omitting it preserves
      the bootloader-initialized panel state.

  iovcc-supply:
    description: I/O voltage rail

  vsn-supply:
    description: Negative source voltage rail

  vsp-supply:
    description: Positive source voltage rail

required:
  - compatible
  - reg
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "boe,td4320";
            reg = <0>;
            backlight = <&backlight>;
            reset-gpios = <&tlmm 45 GPIO_ACTIVE_LOW>;

            port {
                panel_in: endpoint {
                    remote-endpoint = <&dsi_out>;
                };
            };
        };
    };

...
